<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
  <defs>
    <pattern id="blocks" width="160" height="80" patternUnits="userSpaceOnUse">
      <rect width="160" height="80" fill="#1e2126"/>
      <rect x="0" y="0" width="160" height="80" fill="none" stroke="#141619" stroke-width="3"/>
      <rect x="80" y="40" width="160" height="80" fill="none" stroke="#141619" stroke-width="3"/>
      <line x1="0" y1="40" x2="160" y2="40" stroke="#141619" stroke-width="3"/>
      <line x1="80" y1="0" x2="80" y2="80" stroke="#141619" stroke-width="3"/>
    </pattern>
    <pattern id="pegdots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="2" fill="#0f1114"/>
    </pattern>
    <pattern id="diamondplate" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="34" height="34" fill="#101216"/>
      <rect width="17" height="17" fill="#15171b"/>
      <rect x="17" y="17" width="17" height="17" fill="#15171b"/>
    </pattern>
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101114"/>
      <stop offset="100%" stop-color="#1a1c20"/>
    </linearGradient>
  </defs>

  <!-- base wall -->
  <rect width="1920" height="1080" fill="#15171a"/>
  <rect width="1920" height="760" fill="url(#blocks)" opacity="0.55"/>
  <rect width="1920" height="760" fill="url(#wallFade)" opacity="0.5"/>

  <!-- floor -->
  <rect y="760" width="1920" height="320" fill="url(#diamondplate)"/>
  <rect y="760" width="1920" height="60" fill="#0d0e10" opacity="0.6"/>

  <!-- lamp glow pooling on floor/car -->
  <ellipse cx="1400" cy="620" rx="520" ry="420" fill="url(#lampGlow)"/>

  <!-- two-post lift -->
  <rect x="1080" y="260" width="34" height="820" fill="#2a2d33"/>
  <rect x="1680" y="260" width="34" height="820" fill="#2a2d33"/>
  <rect x="1080" y="700" width="634" height="26" fill="#33363d"/>
  <rect x="1080" y="760" width="634" height="26" fill="#33363d"/>

  <!-- car silhouette resting on the lift arms -->
  <g opacity="0.6">
    <path d="M1150 740
             Q1160 640 1260 610
             L1330 560
             Q1400 520 1480 560
             L1560 610
             Q1650 640 1660 740
             Q1660 760 1630 760
             L1180 760
             Q1150 760 1150 740 Z"
          fill="#2f333b" stroke="#3f434b" stroke-width="4"/>
    <circle cx="1230" cy="762" r="46" fill="#1c1e22" stroke="#3f434b" stroke-width="6"/>
    <circle cx="1580" cy="762" r="46" fill="#1c1e22" stroke="#3f434b" stroke-width="6"/>
    <rect x="1290" y="600" width="220" height="70" rx="10" fill="#262930" opacity="0.7"/>
  </g>

  <!-- hanging shop lamp -->
  <line x1="1400" y1="0" x2="1400" y2="300" stroke="#33363d" stroke-width="4"/>
  <path d="M1360 300 L1440 300 L1425 340 L1375 340 Z" fill="#3a3d44" stroke="#4a4e56" stroke-width="2"/>
  <ellipse cx="1400" cy="345" rx="20" ry="8" fill="#f59e0b" opacity="0.85"/>

  <!-- pegboard -->
  <rect x="90" y="120" width="430" height="540" rx="6" fill="#1d2025" stroke="#2a2d33" stroke-width="3"/>
  <rect x="90" y="120" width="430" height="540" fill="url(#pegdots)"/>

  <!-- hand tools hanging on the pegboard -->
  <g stroke="#7a808c" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M160 230 L160 320"/>
    <circle cx="160" cy="222" r="16" fill="none"/>
    <path d="M150 320 L170 320 L165 340 L155 340 Z" fill="#7a808c" stroke="none"/>
    <path d="M260 240 L260 340"/>
    <rect x="248" y="232" width="24" height="26" rx="4" fill="#9aa0ab" stroke="none"/>
    <path d="M360 240 L340 330"/>
    <path d="M380 240 L400 330"/>
    <circle cx="370" cy="242" r="14" fill="none"/>
  </g>

  <!-- rolling toolbox -->
  <g>
    <rect x="70" y="860" width="230" height="150" rx="8" fill="#3a1f1f" stroke="#4a2626" stroke-width="4"/>
    <rect x="70" y="860" width="230" height="40" rx="8" fill="#4a2626"/>
    <line x1="80" y1="940" x2="290" y2="940" stroke="#241111" stroke-width="3"/>
    <circle cx="110" cy="1020" r="16" fill="#1a1a1a"/>
    <circle cx="260" cy="1020" r="16" fill="#1a1a1a"/>
  </g>

  <!-- workbench with a vise -->
  <g>
    <rect x="560" y="800" width="480" height="34" fill="#2b2e35"/>
    <rect x="580" y="834" width="20" height="180" fill="#22242a"/>
    <rect x="1000" y="834" width="20" height="180" fill="#22242a"/>
    <rect x="650" y="770" width="70" height="34" fill="#3f434b"/>
    <rect x="650" y="750" width="16" height="24" fill="#3f434b"/>
    <rect x="704" y="750" width="16" height="24" fill="#3f434b"/>
  </g>
</svg>
